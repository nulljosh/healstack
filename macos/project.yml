name: HealstackMac
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: "2.5.1"
options:
  bundleIdPrefix: com.heyitsmejosh
  deploymentTarget:
    macOS: '14.0'
settings:
  SWIFT_VERSION: '6.0'
  MARKETING_VERSION: '2.0.0'
  CURRENT_PROJECT_VERSION: '1'
  DEVELOPMENT_TEAM: QMM486NPYC
  CODE_SIGN_STYLE: Automatic
targets:
  DoseMac:
    type: application
    platform: macOS
    sources:
      - path: .
        excludes:
          - '*.xcodeproj'
          - '*.yml'
          - README.md
          - CLAUDE.md
          - Checks
          - icon.svg
          - architecture.svg
      - path: ../ios/Models/BiometricEntry.swift
      - path: ../ios/Models/DoseEntry.swift
      - path: ../ios/Models/HealthEntry.swift
      - path: ../ios/Models/LabResult.swift
      - path: ../ios/Models/MyMedication.swift
      - path: ../ios/Models/Substance.swift
      - path: ../ios/Data/SubstanceDatabase.swift
      - path: ../ios/Services/DataStore.swift
      - path: ../ios/Services/InsightEngine.swift
      - path: ../ios/Services/AuthService.swift
      - path: ../ios/Assets.xcassets
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Healstack
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: ''
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
    entitlements:
      path: HealstackMac.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      CODE_SIGN_ENTITLEMENTS: HealstackMac.entitlements
      PRODUCT_NAME: Healstack
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.dose
      SUPABASE_URL: https://tjsxsqlxjmanwvmywwvw.supabase.co
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRqc3hzcWx4am1hbnd2bXl3d3Z3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA0OTc0MDEsImV4cCI6MjA4NjA3MzQwMX0.LphLfho3wdQC20MhtcnBpzQUNuBoTOobrugQbNGxc68
schemes:
  DoseMac:
    build:
      targets:
        DoseMac: all
    run:
      config: Debug
