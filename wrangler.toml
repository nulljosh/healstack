name = "healstack"
type = "javascript"
main = "src/main.jsx"
compatibility_date = "2025-01-01"

[env.production]
name = "healstack"
routes = [
  { pattern = "healstack.heyitsmejosh.com", zone_name = "heyitsmejosh.com" }
]

[[kv_namespaces]]
binding = "DOSE_KV"
id = "89dd8e64a15f4e41af2a4d49b5a3f7c0"
preview_id = "89dd8e64a15f4e41af2a4d49b5a3f7c0"

[vars]
ALLOWED_ORIGIN = "https://healstack.heyitsmejosh.com"
STRIPE_PRICE_ID = "price_1234567890abcdef"

[build]
command = "npm run build"
cwd = "."
main = "dist/index.html"
watch_paths = ["src/**/*.jsx"]

[[build.upload.rules]]
type = "CompiledContentType"
globs = ["**/*"]
fallthrough = true

[[build.upload.rules]]
type = "Text"
globs = ["**/*.html", "**/*.css"]
