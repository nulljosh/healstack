<!DOCTYPE html><html><head><meta charset="UTF-8"><title>frames</title>
<style>body{margin:0;background:#888;display:flex;gap:8px;align-items:flex-start}
iframe{border:0;height:1500px;background:#fff}</style></head>
<body>
<iframe id="f375" src="/_lp.html" width="375"></iframe>
<iframe id="f414" src="/_lp.html" width="414"></iframe>
<iframe id="f768" src="/_lp.html" width="768"></iframe>
<pre id="out" style="position:fixed;bottom:0;left:0;background:#fff;font:12px monospace;z-index:9"></pre>
<script>
setTimeout(() => {
  const rows = [];
  for (const id of ['f375','f414','f768']) {
    const w = document.getElementById(id).contentWindow;
    const de = w.document.documentElement;
    const bad = [...w.document.querySelectorAll('*')]
      .filter(e => e.getBoundingClientRect().right > de.clientWidth + 1)
      .slice(0,6)
      .map(e => `${e.tagName} r=${Math.round(e.getBoundingClientRect().right)} "${(e.textContent||'').trim().slice(0,20)}"`);
    rows.push(`${id}: VIEW=${de.clientWidth} SCROLLW=${de.scrollWidth} OVERFLOW=${de.scrollWidth-de.clientWidth} ${bad.length?'|| '+bad.join(' ; '):'|| clean'}`);
  }
  document.getElementById('out').textContent = rows.join('\n');
}, 2500);
</script></body></html>
